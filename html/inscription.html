<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Académie de Football Elite</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <a href="../index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Retour à l'accueil
    </a>

    <div class="auth-container">
        <div class="auth-header">
            <img src="../images/logo.png" alt="Logo" class="auth-logo">
            <h2>Inscription</h2>
            <p>Rejoignez l'élite du football !</p>
        </div>
        
        <form class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstname">Prénom</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstname" placeholder="Jean" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="lastname">Nom</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastname" placeholder="Dupont" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="auth-submit">S'inscrire</button>

            <div class="auth-separator">
                <span>OU</span>
            </div>

            <a href="#" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                S'inscrire avec Google
            </a>
        </form>
        
        <div class="auth-footer">
            <p>Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
        </div>
    </div>
</body>
</html>
